name: Diagnose support polygon compiler failure

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare compiler
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config clang-16
      - name: Configure
        run: |
          git submodule update --init -- ss/bui
          cmake -S . -B build-support-diagnostic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-16 -DWARNINGS_AS_ERRORS=ON -DPYTHON_ENFORCE_TESTS=OFF
      - name: Build and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          cmake --build build-support-diagnostic --target tests --parallel 4 > compiler-diagnostic.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            ctest --test-dir build-support-diagnostic -R 'test_support_polygon|test_affine_sets' --timeout 120 --output-on-failure >> compiler-diagnostic.log 2>&1
            result=$?
          fi
          cat compiler-diagnostic.log
          if [ "$result" -ne 0 ]; then
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              description="$(printf "%s" "$line" | cut -c 1-130)"
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                -f state=failure -f context="support-polygon-diagnostic/$n" \
                -f description="$description" || true
            done < <(grep -Ei 'error:|fatal error:|error C[0-9]+|failed|failure|timeout' compiler-diagnostic.log | head -n 5)
          fi
          exit "$result"
