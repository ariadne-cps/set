name: Diagnose critical SPRE22 fixture compiler error

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build-critical-diagnostic \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_PYTHON_BINDINGS=OFF
      - name: Compile critical fixture and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          cmake --build build-critical-diagnostic --target test_spre22_critical --parallel 4 > compiler-diagnostic.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            ctest --test-dir build-critical-diagnostic -R '^test_spre22_critical$' --timeout 120 --output-on-failure >> compiler-diagnostic.log 2>&1
            result=$?
          fi
          cat compiler-diagnostic.log
          if [ "$result" -ne 0 ]; then
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              description="$(printf "%s" "$line" | cut -c 1-130)"
              gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                -f state=failure -f context="critical-diagnostic/$n" \
                -f description="$description" || true
            done < <(grep -Ei 'error:|fatal error:|FAILED|failure|timeout' compiler-diagnostic.log | head -n 8)
          fi
          exit "$result"
